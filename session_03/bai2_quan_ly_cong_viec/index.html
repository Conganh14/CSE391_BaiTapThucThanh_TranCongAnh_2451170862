<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý công việc</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <h1>✅ Quản lý Công việc</h1>
        <p class="subtitle">Ứng dụng quản lý công việc cá nhân</p>
      </header>

      <!-- Statistics -->
      <section class="statistics">
        <div class="stat-card">
          <h3>Tổng công việc</h3>
          <p id="totalTasks" class="stat-value">0</p>
        </div>
        <div class="stat-card">
          <h3>Đã hoàn thành</h3>
          <p id="completedTasks" class="stat-value">0</p>
        </div>
        <div class="stat-card">
          <h3>Chưa hoàn thành</h3>
          <p id="pendingTasks" class="stat-value">0</p>
        </div>
      </section>

      <!-- Action Bar -->
      <section class="action-bar">
        <button id="btnAddTask" class="btn btn-primary">
          + Thêm công việc
        </button>
      </section>

      <!-- Alert Message -->
      <div id="alertBox" class="alert-box"></div>

      <!-- Tasks List -->
      <section class="tasks-section">
        <div id="tasksList" class="tasks-list">
          <div class="empty-state">
            <p>📭 Chưa có công việc nào. Hãy thêm một công việc!</p>
          </div>
        </div>
      </section>
    </div>

    <!-- Modal Form -->
    <div id="modalForm" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Thêm công việc</h2>
          <button id="btnCloseModal" class="btn-close">&times;</button>
        </div>
        <form id="taskForm" class="form">
          <div class="form-group">
            <label for="taskTitle">Tiêu đề:</label>
            <input
              type="text"
              id="taskTitle"
              required
              placeholder="Nhập tiêu đề công việc"
            />
          </div>
          <div class="form-group">
            <label for="taskDescription">Mô tả:</label>
            <textarea
              id="taskDescription"
              rows="3"
              placeholder="Mô tả chi tiết công việc"
            ></textarea>
          </div>
          <div class="form-group">
            <label for="taskDeadline">Hạn hoàn thành:</label>
            <input type="date" id="taskDeadline" required />
          </div>
          <div class="form-group">
            <label for="taskPriority">Mức ưu tiên:</label>
            <select id="taskPriority" required>
              <option value="">-- Chọn mức ưu tiên --</option>
              <option value="Thấp">🟢 Thấp</option>
              <option value="Trung bình">🟡 Trung bình</option>
              <option value="Cao">🔴 Cao</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" id="btnCancel" class="btn btn-secondary">
              Hủy
            </button>
            <button type="submit" id="btnSave" class="btn btn-primary">
              Thêm
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
